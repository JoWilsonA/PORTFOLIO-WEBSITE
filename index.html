    <style>
        #authorBtn .btn {
            display: inline-block;
            width: 140px;
            padding: 10px;
            border: 2px solid #080838;
            background: transparent;
            color: #080838;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: color 0.3s;
        }

        #authorBtn .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: #080838;
            z-index: -1;
            transition: width 0.4s ease;
        }

        #authorBtn .btn:hover::before {
            width: 100%;
        }

        #authorBtn .btn:hover {
            color: #FFFFFF;
        }
    </style>
</head>
