<!DOCTYPE html>

    <title>Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #ffffff;
            color: #080838;
            font-family: "Poppins", sans-serif;
        }

        main {
            max-width: 1200px;
            margin: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .galleryGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 0 20px;
        }

        .galleryItem {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .galleryItem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        .galleryItem:hover img {
            transform: scale(1.1);
        }

        .galleryItem::after {
            content: attr(data-title);
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            background: rgba(3, 48, 71, 0.8);
            color: #fff;
            font-size: 0.9rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .galleryItem:hover::after {
            opacity: 1;
        }

        @media (max-width: 480px) {
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
